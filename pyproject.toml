[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-rollout-stall-detector"
version = "0.1.0"
description = "Find Kubernetes rollouts that are stuck mid-flight and print the concrete reason"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["kubernetes", "k8s", "rollout", "deployment", "sre", "devops", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
k8s-rollout-stall-detector = "rollout_stall.cli:run"

[project.urls]
Homepage = "https://github.com/moveeeax/k8s-rollout-stall-detector"
Issues = "https://github.com/moveeeax/k8s-rollout-stall-detector/issues"

[tool.setuptools]
packages = ["rollout_stall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
